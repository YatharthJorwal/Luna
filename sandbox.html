<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luna — Sandbox</title>
    <link rel="stylesheet" href="/src/sandbox.css" />
  </head>
  <body>
    <div id="sandbox-stage">
      <canvas id="sandbox-canvas"></canvas>
    </div>

    <div id="sandbox-info">
      <div id="sandbox-title">Luna — full-body sandbox</div>
      <div id="sandbox-help">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — move</span>
        <span><kbd>Shift</kbd> — faster</span>
        <span><kbd>Tab</kbd> — spectate / walk in</span>
        <span class="mode-spectator"><kbd>Space</kbd> up · right-drag look</span>
        <span class="mode-visitor">click to look · <kbd>C</kbd> crouch</span>
      </div>
      <div id="sandbox-status">Loading…</div>
      <div id="sandbox-modes" role="group" aria-label="Time of day"></div>
    </div>

    <div id="caption" aria-live="polite"></div>

    <div id="hud">
      <div id="status-dot" title="disconnected"></div>
      <input
        id="input-box"
        type="text"
        placeholder="Say something to Luna…"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="mic-button" type="button" title="Voice input" aria-label="Voice input" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" />
          <path d="M6 11a1 1 0 1 1 2 0 4 4 0 0 0 8 0 1 1 0 1 1 2 0 6 6 0 0 1-5 5.917V19h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-2.083A6 6 0 0 1 6 11Z" />
        </svg>
      </button>
      <button id="action-button" type="button" hidden></button>
    </div>

    <script type="module" src="/src/sandbox.ts"></script>
  </body>
</html>
