<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luna</title>
    <link rel="stylesheet" href="/src/style.css" />
    <!--
      Live2D's Cubism Core runtime is proprietary and Live2D's own license
      terms don't allow third parties to redistribute it -- you grab it
      yourself and drop it in /public. See public/live2d/README.txt.
    -->
    <script src="/live2dcubismcore.min.js"></script>
  </head>
  <body>
    <div id="stage-container">
      <canvas id="live2d-canvas"></canvas>
    </div>

    <div id="hud">
      <div id="status-dot" title="disconnected"></div>
      <input
        id="input-box"
        type="text"
        placeholder="Say something to Luna…"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="mic-button" type="button" title="Voice input" aria-label="Voice input" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" />
          <path d="M6 11a1 1 0 1 1 2 0 4 4 0 0 0 8 0 1 1 0 1 1 2 0 6 6 0 0 1-5 5.917V19h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-2.083A6 6 0 0 1 6 11Z" />
        </svg>
      </button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
