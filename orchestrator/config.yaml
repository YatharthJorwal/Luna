# Luna orchestrator config -- Phase 2+.
#
# Everything here is meant to be user-editable without touching Python, per
# CLAUDE.md's working agreement ("Model/engine choices are config, never
# hardcoded"). See docs/MODELS.md for background on the model/TTS choices.

llm:
  # Root URL of whatever's serving the model -- llm.py appends the right
  # path itself based on api_style below. Ollama's default root is this;
  # llama.cpp's `server` binary defaults to http://127.0.0.1:8080 instead.
  base_url: "http://127.0.0.1:11434"
  # qwen3.5:9b, chosen over the original qwen3-vl:8b pick: natively
  # multimodal (not vision-bolted-on) and benchmarks ahead of qwen3-vl even
  # at larger sizes. Pull it first: `ollama pull qwen3.5:9b` (defaults to
  # Q4_K_M quantization, ~6.6GB, fits the 12GB 3060 fine). See
  # docs/DECISIONS.md for the full reasoning and the thinking-mode caveat
  # that comes with it (see api_style/think below).
  model: "qwen3.5:9b"
  # Ollama and llama.cpp both ignore this, but the OpenAI request shape
  # wants a non-empty string -- "ollama" is the placeholder Ollama's own
  # docs use. Unused when api_style is "ollama_native".
  api_key: "ollama"
  temperature: 0.8
  max_tokens: 512
  # "ollama_native" talks to Ollama's own /api/chat -- required for the
  # `think` setting below to actually be honored (see docs/DECISIONS.md:
  # Ollama's OpenAI-compatible /v1 endpoint unreliably forwards it as of
  # mid-2026, some models even silently drop it). "openai" talks to the
  # generic /v1/chat/completions shape instead -- use this for llama.cpp,
  # or for a plain (non-thinking) model where the native/openai difference
  # doesn't matter.
  api_style: "ollama_native"
  # Qwen3.5 is a hybrid-thinking model: left on, it can emit a reasoning
  # phase before every reply, which is a bad trade for a companion that's
  # supposed to answer in quick spoken sentences. false here forces
  # non-thinking mode -- only takes effect when api_style is
  # "ollama_native" (see above). Set to null to not send the field at all
  # (e.g. if you swap to a model that errors on an unrecognized param).
  think: false

tts:
  # Only "pyttsx3" exists right now (Phase 1 placeholder, still true in
  # Phase 2). Real voice work (GPT-SoVITS) is next -- see docs/MODELS.md.
  engine: "pyttsx3"

session:
  # How many past (user, assistant) turns to keep in the LLM's context
  # before dropping the oldest. Session-only -- gone on disconnect. Durable
  # memory across restarts is Phase 3.
  max_history_turns: 20
