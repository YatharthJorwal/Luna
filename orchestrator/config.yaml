# Luna orchestrator config -- Phase 2+.
#
# Everything here is meant to be user-editable without touching Python, per
# CLAUDE.md's working agreement ("Model/engine choices are config, never
# hardcoded"). See docs/MODELS.md for background on the model/TTS choices.

llm:
  # Root URL of whatever's serving the model -- llm.py appends the right
  # path itself based on api_style below. Ollama's default root is this;
  # llama.cpp's `server` binary defaults to http://127.0.0.1:8080 instead.
  base_url: "http://127.0.0.1:11434"
  # qwen3.5:9b, chosen over the original qwen3-vl:8b pick: natively
  # multimodal (not vision-bolted-on) and benchmarks ahead of qwen3-vl even
  # at larger sizes. Pull it first: `ollama pull qwen3.5:9b` (defaults to
  # Q4_K_M quantization, ~6.6GB, fits the 12GB 3060 fine). See
  # docs/DECISIONS.md for the full reasoning and the thinking-mode caveat
  # that comes with it (see api_style/think below).
  model: "qwen3.5:9b"
  # Ollama and llama.cpp both ignore this, but the OpenAI request shape
  # wants a non-empty string -- "ollama" is the placeholder Ollama's own
  # docs use. Unused when api_style is "ollama_native".
  api_key: "ollama"
  temperature: 0.8
  max_tokens: 512
  # "ollama_native" talks to Ollama's own /api/chat -- required for the
  # `think` setting below to actually be honored (see docs/DECISIONS.md:
  # Ollama's OpenAI-compatible /v1 endpoint unreliably forwards it as of
  # mid-2026, some models even silently drop it). "openai" talks to the
  # generic /v1/chat/completions shape instead -- use this for llama.cpp,
  # or for a plain (non-thinking) model where the native/openai difference
  # doesn't matter.
  api_style: "ollama_native"
  # Qwen3.5 is a hybrid-thinking model: left on, it can emit a reasoning
  # phase before every reply, which is a bad trade for a companion that's
  # supposed to answer in quick spoken sentences. false here forces
  # non-thinking mode -- only takes effect when api_style is
  # "ollama_native" (see above). Set to null to not send the field at all
  # (e.g. if you swap to a model that errors on an unrecognized param).
  think: false

tts:
  # "pyttsx3" (current active default) or "gpt_sovits" (flip this once your
  # GPT-SoVITS API server is running and the block below points at your
  # real reference clip -- see docs/MODELS.md for how to get there).
  engine: "gpt_sovits"
  gpt_sovits:
    # GPT-SoVITS's own API server (a separate process you run yourself --
    # not something the orchestrator launches). Default port per its docs.
    api_url: "http://127.0.0.1:9880/tts"
    # Wherever your reference WAV lives on disk, and an *exact* transcript
    # of what's said in it -- GPT-SoVITS uses the transcript as part of
    # the voice-cloning conditioning, not just a label. Empty until you
    # fill these in; synthesize() only calls gpt_sovits when engine above
    # is actually set to it, so leaving these blank while engine stays
    # "pyttsx3" is harmless.
    # WINDOWS PATH GOTCHA: use single quotes for this, e.g.
    # 'C:\Users\you\ref.wav' -- double quotes treat backslashes as escape
    # codes and will fail to parse (see config.py's load_config() for the
    # full explanation if you hit this).
    ref_audio_path: 'C:\Users\User\Downloads\character_files_main_sample.wav'
    prompt_text: "This is a sample voice for you to just get started with because it sounds kind of cute, but just make sure this doesn't have long silences."
    prompt_lang: "en"
    text_lang: "en"

stt:
  # faster-whisper model size. "small" is a good accuracy/speed balance for
  # short spoken utterances (a sentence or two at a time, not dictation) --
  # step down to "base" if transcription feels slow, up to "medium" if you
  # flip device to "cuda" below and have VRAM to spare.
  model_size: "small"
  # Runs on the 3060 via CUDA. faster-whisper (via its CTranslate2 backend)
  # has full CUDA support -- this isn't a CPU-only library, "cpu" was just
  # the original starting default for VRAM headroom (see docs/DECISIONS.md
  # for the reversal). qwen3.5:9b (~6.6GB) + a "small" Whisper model in
  # float16 (~1GB) both fit comfortably in 12GB with room to spare.
  # Windows gotcha: CTranslate2's CUDA path needs cuBLAS/cuDNN DLLs on
  # PATH, which faster-whisper does NOT install for you via pip -- if you
  # hit a "cudnn_ops64_9.dll not found" (or similar) error on first mic
  # use, see README's troubleshooting section.
  device: "cuda"
  # int8_float16 quantization -- CTranslate2's recommended pairing for CUDA
  # (float16 compute, int8-quantized weights): meaningfully faster and
  # lower-VRAM than plain float16 with negligible accuracy loss. Use "int8"
  # instead if device is "cpu".
  compute_type: "int8_float16"
  # Force a language instead of auto-detecting (e.g. "en") -- auto-detect
  # costs a little extra latency on very short clips and can occasionally
  # guess wrong on a one- or two-word utterance. Set to null to let
  # faster-whisper auto-detect instead.
  language: "en"

session:
  # How many past (user, assistant) turns to keep in the LLM's context
  # before dropping the oldest. Session-only -- gone on disconnect. Durable
  # memory across restarts is Phase 3.
  max_history_turns: 20