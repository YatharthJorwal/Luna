# Luna orchestrator config -- Phase 2+.
#
# Everything here is meant to be user-editable without touching Python, per
# CLAUDE.md's working agreement ("Model/engine choices are config, never
# hardcoded"). See docs/MODELS.md for background on the model/TTS choices.

llm:
  # Root URL of whatever's serving the model -- llm.py appends the right
  # path itself based on api_style below. Ollama's default root is this;
  # llama.cpp's `server` binary defaults to http://127.0.0.1:8080 instead.
  base_url: "http://127.0.0.1:11434"
  # qwen3.5:9b, chosen over the original qwen3-vl:8b pick: natively
  # multimodal (not vision-bolted-on) and benchmarks ahead of qwen3-vl even
  # at larger sizes. Pull it first: `ollama pull qwen3.5:9b` (defaults to
  # Q4_K_M quantization, ~6.6GB, fits the 12GB 3060 fine). See
  # docs/DECISIONS.md for the full reasoning and the thinking-mode caveat
  # that comes with it (see api_style/think below).
  model: "qwen3.5:9b"
  # Ollama and llama.cpp both ignore this, but the OpenAI request shape
  # wants a non-empty string -- "ollama" is the placeholder Ollama's own
  # docs use. Unused when api_style is "ollama_native".
  api_key: "ollama"
  temperature: 0.8
  max_tokens: 512
  # "ollama_native" talks to Ollama's own /api/chat -- required for the
  # `think` setting below to actually be honored (see docs/DECISIONS.md:
  # Ollama's OpenAI-compatible /v1 endpoint unreliably forwards it as of
  # mid-2026, some models even silently drop it). "openai" talks to the
  # generic /v1/chat/completions shape instead -- use this for llama.cpp,
  # or for a plain (non-thinking) model where the native/openai difference
  # doesn't matter.
  api_style: "ollama_native"
  # Qwen3.5 is a hybrid-thinking model: left on, it can emit a reasoning
  # phase before every reply, which is a bad trade for a companion that's
  # supposed to answer in quick spoken sentences. false here forces
  # non-thinking mode -- only takes effect when api_style is
  # "ollama_native" (see above). Set to null to not send the field at all
  # (e.g. if you swap to a model that errors on an unrecognized param).
  think: false
  # Context window in tokens, sent to Ollama on EVERY call to the model
  # (chat, tools, vision, background classifiers -- keep it one value:
  # Ollama reloads the model when two requests disagree). Not setting it
  # leaves the server's default, which was too small once the persona
  # prompt + tool schemas + memory block + history grew: replies were cut
  # off after a few words with done_reason "length" (docs/DECISIONS.md).
  # 8192 fits comfortably on the 12GB 3060 next to GPT-SoVITS; raise to
  # 16384 only if `nvidia-smi` shows headroom. null = don't send it.
  # Only honored with api_style "ollama_native" (for "openai", set
  # OLLAMA_CONTEXT_LENGTH on the server instead). app.py trims the oldest
  # history to fit this window before each call (context_budget.py).
  num_ctx: 8192
  # Optional: a separate model for everything that reads an image (screen
  # looks, Continuous OCR, Task Guide, camera, uploads). null = use `model`
  # above. REQUIRED if `model` has no vision -- e.g. a community GGUF pulled
  # with `hf.co/...` that ships text-only (the startup log prints what Ollama
  # says each model can do: grep "model capabilities"). The main chat model
  # never receives pixels, so it may be text-only. Both models have to fit in
  # VRAM together with GPT-SoVITS or Ollama swaps them on every request: on
  # the 12GB 3060 pair a ~7GB chat model with at most a ~2GB vision model
  # (qwen3.5:2b-q4_K_M, 1.9GB), or use ONE multimodal model for everything.
  vision_model: null

tts:
  # "pyttsx3" (current active default) or "gpt_sovits" (flip this once your
  # GPT-SoVITS API server is running and the block below points at your
  # real reference clip -- see docs/MODELS.md for how to get there).
  engine: "gpt_sovits"
  gpt_sovits:
    # GPT-SoVITS's own API server (a separate process you run yourself --
    # not something the orchestrator launches). Default port per its docs.
    api_url: "http://127.0.0.1:9880/tts"
    # Wherever your reference WAV lives on disk, and an *exact* transcript
    # of what's said in it -- GPT-SoVITS uses the transcript as part of
    # the voice-cloning conditioning, not just a label. Empty until you
    # fill these in; synthesize() only calls gpt_sovits when engine above
    # is actually set to it, so leaving these blank while engine stays
    # "pyttsx3" is harmless.
    # WINDOWS PATH GOTCHA: use single quotes for this, e.g.
    # 'C:\Users\you\ref.wav' -- double quotes treat backslashes as escape
    # codes and will fail to parse (see config.py's load_config() for the
    # full explanation if you hit this).
    ref_audio_path: /path/to/your/character_sample.wav
    prompt_text: "This is a sample voice for you to just get started with because it sounds kind of cute, but just make sure this doesn't have long silences."
    prompt_lang: "en"
    text_lang: "en"

stt:
  # faster-whisper model size. "small" is a good accuracy/speed balance for
  # short spoken utterances (a sentence or two at a time, not dictation) --
  # step down to "base" if transcription feels slow, up to "medium" if you
  # flip device to "cuda" below and have VRAM to spare.
  model_size: "small"
  # Runs on CPU, for now -- reverted from CUDA after confirming the exact
  # missing-DLL error on the user's real machine ("Library cublas64_12.dll
  # is not found or cannot be loaded"). faster-whisper/CTranslate2 does
  # have full CUDA support and this can be revisited -- either installing
  # the NVIDIA cuBLAS/cuDNN redistributables system-wide, or via the
  # `nvidia-cublas-cu12`/`nvidia-cudnn-cu12` pip wheels (which likely also
  # need their DLL directory added to PATH or via os.add_dll_directory()
  # for CTranslate2 to actually find them -- unverified, worth confirming
  # before assuming pip install alone is enough) -- but CPU with a "small"
  # model is fast enough for short conversational clips on modern
  # hardware, and it works with zero extra setup right now. See
  # docs/DECISIONS.md for the full back-and-forth on this.
  device: "cpu"
  # int8 quantization -- fastest CPU option, accuracy hit is negligible for
  # short conversational utterances. Use "int8_float16" instead if device
  # is "cuda".
  compute_type: "int8"
  # Force a language instead of auto-detecting (e.g. "en") -- auto-detect
  # costs a little extra latency on very short clips and can occasionally
  # guess wrong on a one- or two-word utterance. Set to null to let
  # faster-whisper auto-detect instead.
  language: "en"

session:
  # How many past (user, assistant) turns to keep in the LLM's context
  # before dropping the oldest. Session-only -- gone on disconnect. Durable
  # memory across restarts is Phase 3 (see `memory` below).
  max_history_turns: 20
  # Display name only -- how the user's own lines are labeled in Phase 9's
  # conversation-log panel ("Yatharth: hello" / "Luna: ..."). Never sent to
  # the LLM or used in the persona prompt; purely a frontend label pulled
  # through app.py's `get_log` response.
  user_name: "Yatharth"
  # How many unprompted comments (Task Guide chides + Continuous OCR
  # remarks) stay in the LLM's history at once; older ones are dropped.
  # They add little and flood the context. Optional (defaults to 3).
  max_unprompted_in_history: 3

memory:
  # Phase 3 -- persistent memory (facts + episode summaries), surviving
  # app restarts unlike `session` above. SQLite file, relative to
  # orchestrator/ (created on first use, gitignored -- see
  # docs/DECISIONS.md for why it lives here instead of a platform data
  # dir, same "repo-relative, runs from source" reasoning as everything
  # else in this project).
  db_path: "data/memory.db"
  # How many past episode summaries get semantically recalled per turn,
  # nearest-first by embedding distance. Small on purpose -- a few
  # genuinely relevant callbacks, not a history dump.
  recall_top_k: 5
  embedding:
    # Reuses the same Ollama instance the LLM talks to -- one running
    # server, not a second process. Override if embeddings ever move to a
    # separate server.
    base_url: "http://127.0.0.1:11434"
    # nomic-embed-text: small (~274MB), Apache-2.0, well-established --
    # fits in VRAM alongside qwen3.5:9b with room to spare (see
    # docs/MODELS.md). Pull it first: `ollama pull nomic-embed-text`.
    model: "nomic-embed-text"
    # Must match the configured model's actual output width -- 768 for
    # nomic-embed-text. sqlite-vec's episode_vectors table bakes this in
    # at creation time; see memory/db.py's dimension-mismatch check for
    # what happens if this and the model ever disagree.
    dimension: 768

task_guide:
  # Phase 4 Round 2 -- Task Guide Mode's scheduled screen-check loop
  # (task_guide.py). While a task is being tracked (the set_active_task
  # tool), how often, in seconds, the orchestrator captures the screen
  # and compares it against the current step. docs/ARCHITECTURE.md
  # suggests starting conservative (60-120s) -- 90 is the midpoint; tune
  # down if drift goes unnoticed too long, up if it feels naggy.
  capture_interval_seconds: 90
  # If no real user turn happens for this many seconds while a task is
  # tracked, the task is silently dropped (no chide, no message) rather
  # than kept active forever nagging someone who has stepped away.
  # 1800 = 30 minutes.
  idle_timeout_seconds: 1800

ocr_watch:
  # Quick-action menu's Continuous OCR toggle (ocr_watch.py) -- how often,
  # in seconds, the orchestrator glances at the screen while watching is
  # on. Much longer than task_guide's own capture_interval_seconds above
  # on purpose -- this is ambient commentary, not goal-directed
  # drift-checking, and should be rare by design. 240 = 4 minutes; tune
  # up if it ever feels naggy, down if genuinely interesting moments are
  # being missed.
  comment_interval_seconds: 240
  # Hard floor, enforced in code, between two SPOKEN remarks. Only matters
  # when comment_interval_seconds is set below it (e.g. 30 for testing).
  # Optional (defaults to 120).
  min_comment_gap_seconds: 120
  # Two consecutive screen summaries sharing at least this fraction of
  # their content words (0-1) count as "the same screen" and never get a
  # remark, whatever the model said. Optional (defaults to 0.6).
  same_screen_similarity: 0.6
  # Skip ambient checks while a Task Guide task is active (Task Guide is
  # already watching the screen). Optional (defaults to true).
  pause_during_task: true

# How big a screenshot is when the model sees it. A vision model pays per
# pixel (a full 1080p capture is ~2.6k image tokens), and the original code
# sent every capture at native resolution as PNG, which made Continuous OCR
# and Task Guide slow. Both whole section and every key are optional.
vision:
  # Longest side in pixels for background glances (Continuous OCR, Task
  # Guide): enough to tell what app is open and roughly what is on screen,
  # not to read small print. Raise it if glances miss things you care about.
  ambient_max_long_edge: 1024
  # Longest side for an explicit "look at my screen" request -- sharper so
  # small text is readable. 0 = never downscale.
  look_max_long_edge: 1600
  jpeg_quality: 85
